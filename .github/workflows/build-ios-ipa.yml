name: Build iOS IPA (Unsigned for Sideloadly / SideStore)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build SoundVault.ipa on macOS
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.3 (Swift 6.2 for Expo SDK 58)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version
          swift --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install
          sed -i '' 's/swiftLanguageModes: \[.v6\]/swiftLanguageModes: [.v5]/g' node_modules/expo-modules-jsi/apple/Package.swift

      - name: Expo Prebuild (Generate Native iOS Project)
        run: |
          npx expo prebuild --platform ios --clean
          ls -la ios

      - name: Build iOS App (Unsigned Release for Physical iPhone)
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building Workspace: $WORKSPACE | Scheme: $SCHEME"

          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build

      - name: Package .app into SoundVault.ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          echo "Found built app at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r -q SoundVault.ipa Payload

      - name: Upload SoundVault.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundVault-iOS-IPA
          path: SoundVault.ipa
          retention-days: 30
