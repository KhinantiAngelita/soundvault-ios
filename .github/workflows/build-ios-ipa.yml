name: Build iOS IPA (Unsigned for Sideloadly / SideStore)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build SoundVault.ipa on macOS 26 (Xcode 26.6)
    runs-on: macos-26

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Xcode 26.6 Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Expo Prebuild (Generate Native iOS Project)
        run: |
          npx expo prebuild --platform ios --clean
          ls -la ios

      - name: Build iOS App (Unsigned Release for Physical iPhone)
        run: |
          WORKSPACE=$(find ios -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Building Workspace: $WORKSPACE | Scheme: $SCHEME"

          set +e
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath ios/build \
            ARCHS="arm64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build > xcodebuild.log 2>&1
          EXIT_CODE=$?
          if [ $EXIT_CODE -ne 0 ]; then
            echo "=== XCODEBUILD ERRORS ==="
            grep -E "error:|BUILD FAILED" xcodebuild.log | tail -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            tail -n 100 xcodebuild.log
            exit $EXIT_CODE
          fi
          set -e

      - name: Package .app into SoundVault.ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios/build/Build/Products/Release-iphoneos -name "*.app" -maxdepth 1 | head -n 1)
          echo "Found built app at: $APP_PATH"
          cp -R "$APP_PATH" Payload/
          zip -r -q SoundVault.ipa Payload
          ls -lh SoundVault.ipa

      - name: Upload SoundVault.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SoundVault-iOS-IPA
          path: SoundVault.ipa
          retention-days: 30

      - name: Publish SoundVault.ipa to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0 SoundVault.ipa \
            --title "SoundVault iOS v1.0.0" \
            --notes "File instalasi SoundVault.ipa siap pasang ke iPhone 11 via Sideloadly / SideStore." \
            --clobber || gh release upload v1.0.0 SoundVault.ipa --clobber
